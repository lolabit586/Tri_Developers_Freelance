<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Tri_Developer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: #E1D4C2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #291C0E;
        }

        .login-card {
            background: #BEB5A9;
            border-radius: 25px;
            border: 1px solid #A78D78;
            padding: 40px;
            width: 420px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(41, 28, 14, 0.15);
        }

        h2 {
            color: #291C0E;
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        p {
            color: #6E473B;
            font-weight: 500;
        }

        input,
        textarea {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #E1D4C2;
            border: 1px solid #A78D78;
            border-radius: 12px;
            color: #291C0E;
            outline: none;
            font-family: 'Poppins';
            font-size: 15px;
            box-sizing: border-box;
        }

        input::placeholder,
        textarea::placeholder {
            color: #A78D78;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: linear-gradient(135deg, #6E473B, #A78D78);
            border: none;
            border-radius: 12px;
            color: #E1D4C2;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .footer-links {
            margin-top: 25px;
        }

        .footer-links a {
            color: #291C0E;
            text-decoration: none;
            font-weight: bold;
        }

        .error-message {
            color: #6E473B;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2>Contact Us</h2>
        <p>Send us a message</p>

        <form id="contactForm">
            <input type="text" id="contactName" placeholder="Your Name" required>
            <input type="email" id="contactEmail" placeholder="Email Address" required>
            <textarea id="contactMessage" placeholder="How can we help you?" rows="4" required></textarea>

            <div id="contactError" class="error-message"></div>

            <button type="button" onclick="sendMessage()">Send Message</button>
        </form>

        <div class="footer-links">
            <a href="../index.html">Back to Home</a>
        </div>
    </div>

    <script>
        console.log("Log: Contact page initialized. Standing by to accept feedback submission.");

        function sendMessage() {
            var name = document.getElementById("contactName").value;
            var email = document.getElementById("contactEmail").value;
            var message = document.getElementById("contactMessage").value;
            var errorDiv = document.getElementById("contactError");

            console.log("Log: Send Message button clicked. Inspecting support ticket...");
            console.log("Captured Data -> From: " + name + " | Message Length: " + message.length + " characters.");

            if (name === "" || email === "" || message === "") {
                console.warn("Validation Warning: User attempted to send an incomplete feedback message.");
                errorDiv.innerText = "Please fill in all fields before sending!";
                errorDiv.style.display = "block";
            } else {
                console.log("Log: Message validation successful. Dispatching notification...");
                errorDiv.style.display = "none";
                alert("Thank you, ! Your message has been sent successfully.");
                window.location.href = "../index.html";


                // document.getElementById("contactForm").reset();
                // console.log("Log: Contact form cleared and reset to initial state.");
            }
        }
    </script>

</body>

</html>
