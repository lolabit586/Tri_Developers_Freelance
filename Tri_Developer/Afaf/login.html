<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tri_Developer</title>
    <!-- <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet"> -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: #E1D4C2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #291C0E;
        }

        .login-card {
            background: #BEB5A9;
            border-radius: 25px;
            border: 1px solid #A78D78;
            padding: 40px;
            width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(41, 28, 14, 0.15);
        }

        h2 {
            color: #291C0E;
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        p {
            color: #6E473B;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            background: #E1D4C2;
            border: 1px solid #A78D78;
            border-radius: 12px;
            color: #291C0E;
            outline: none;
            font-size: 15px;
            box-sizing: border-box;
        }

        input::placeholder {
            color: #A78D78;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: linear-gradient(135deg, #6E473B, #A78D78);
            border: none;
            border-radius: 12px;
            color: #E1D4C2;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(110, 71, 59, 0.3);
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .footer-links {
            margin-top: 25px;
            color: #6E473B;
        }

        .footer-links a {
            color: #291C0E;
            text-decoration: none;
            font-weight: bold;
        }

        .error-message {
            color: #6E473B;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2>Login</h2>
        <p>Welcome to Tri_Developer</p>

        <form id="loginForm">
            <input type="email" id="emailInput" placeholder="Email Address" required>
            <input type="password" id="passwordInput" placeholder="Password" required>
            <div id="errorDiv" class="error-message"></div>
            <button type="button" onclick="validateLogin()">Login</button>
        </form>

        <div class="footer-links">
            <p>Don't have an account? <a href="signup.html">Create Account</a></p>
        </div>
    </div>

    <script>
        // كونسول ترحيبي يطبع فور تحميل الصفحة للتأكد من اتصال الجافا سكريبت بنجاح
        console.log("Log: Login page loaded successfully. Ready for user inputs.");

        function validateLogin() {
            var email = document.getElementById("emailInput").value;
            var password = document.getElementById("passwordInput").value;
            var errorDiv = document.getElementById("errorDiv");

            console.log("Log: Login button clicked. Checking credentials...");
            console.log("Captured Data -> Email: " + email + " | Password Length: " + password.length);

            if (email === "" || password === "") {
                console.warn("Validation Warning: User left fields empty!");
                errorDiv.innerText = "Please fill in all fields!";
                errorDiv.style.display = "block";
            } else if (password.length < 6) {
                console.warn("Validation Warning: Password is shorter than 6 characters.");
                errorDiv.innerText = "Password must be at least 6 characters!";
                errorDiv.style.display = "block";
            } else {
                console.log("Log: Validation passed successfully. Redirecting user to home.html...");
                errorDiv.style.display = "none";
                alert("Login Successful! Redirecting to Home Page...");
                window.location.href = "../index.html";
            }
        }
    </script>

</body>

</html>
