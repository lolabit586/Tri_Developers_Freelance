<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Tri_Developer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-card">
        <h2>Register</h2>
        <p>Join Tri_Developer Team</p>
        <form id="registerForm">
            <input type="text" id="nameInput" placeholder="Full Name" required>
            <input type="email" id="signUpEmail" placeholder="Email Address" required>
            <input type="password" id="signUpPassword" placeholder="Password" required>
            <select id="roleSelect" required>
                <option value="" disabled selected>Select Role</option>
                <option value="seller">Seller</option>
                <option value="buyer">Buyer</option>
            </select>
            <div id="signUpError" class="error-message"></div>
            <button type="button" onclick="validateSignUp()">Register Now</button>
        </form>
        <div class="footer-links">
            <p>Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>

    <script>
        console.log("Log: Registration page loaded via external CSS.");
        function validateSignUp() {
            var name = document.getElementById("nameInput").value;
            var email = document.getElementById("signUpEmail").value;
            var password = document.getElementById("signUpPassword").value;
            var role = document.getElementById("roleSelect").value;
            var errorDiv = document.getElementById("signUpError");
            if (name === "" || email === "" || password === "" || role === "") {
                errorDiv.innerText = "All fields are required!";
                errorDiv.style.display = "block";
            } else if (password.length < 6) {
                errorDiv.innerText = "Password must be at least 6 characters!";
                errorDiv.style.display = "block";
            } else {
                errorDiv.style.display = "none";
                alert("Account Created Successfully!");
                window.location.href = "login.html"; 
            }
        }
    </script>
</body>
</html>
